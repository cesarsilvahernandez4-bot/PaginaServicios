<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Gestión de Servicios | Panel Ambulancias de los Llanos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <link href="admin.css" rel="stylesheet">
</head>
<body class="admin-body">
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="admin-main">
            <div class="admin-topbar">
                <div>
                    <h1>Gestión de Servicios</h1>
                    <p>Administra los servicios TAB, TAM, Eventos y Domiciliario que se muestran en el sitio público.</p>
                </div>
                <button class="btn btn-primary" id="btn-nuevo-servicio" type="button">+ Nuevo servicio</button>
            </div>

            <section class="stats" id="stats"></section>

            <section class="panel">
                <div class="panel-toolbar">
                    <input class="search-input" id="buscar-servicio" type="search" placeholder="Buscar por nombre o descripción...">
                    <div class="chip-group" id="filtro-categoria">
                        <button class="chip is-active" data-cat="" type="button">Todos</button>
                        <button class="chip" data-cat="TAB" type="button">TAB</button>
                        <button class="chip" data-cat="TAM" type="button">TAM</button>
                        <button class="chip" data-cat="Eventos" type="button">Eventos</button>
                        <button class="chip" data-cat="Domiciliario" type="button">Domiciliario</button>
                    </div>
                </div>
                <div class="table-wrap">
                    <table class="data-table" id="tabla-servicios">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Servicio</th>
                                <th>Categoría</th>
                                <th>Precio referencial</th>
                                <th>Estado</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody><tr><td colspan="6" class="empty-state">Cargando servicios...</td></tr></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <dialog class="modal-dialog" id="modal-servicio">
        <form id="form-servicio" method="dialog">
            <div class="modal-head">
                <h2 id="modal-titulo">Nuevo servicio</h2>
                <button class="icon-btn" type="button" id="btn-cerrar-modal" aria-label="Cerrar">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="servicio-id">
                <div class="field">
                    <label for="servicio-nombre">Nombre</label>
                    <input id="servicio-nombre" required maxlength="255">
                </div>
                <div class="row-2">
                    <div class="field">
                        <label for="servicio-categoria">Categoría</label>
                        <select id="servicio-categoria" required>
                            <option value="TAB">TAB - Traslado Asistencial Básico</option>
                            <option value="TAM">TAM - Traslado Asistencial Medicalizado</option>
                            <option value="Eventos">Eventos</option>
                            <option value="Domiciliario">Domiciliario</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="servicio-estado">Estado</label>
                        <select id="servicio-estado">
                            <option value="Activo">Activo (visible)</option>
                            <option value="Inactivo">Inactivo (oculto)</option>
                        </select>
                    </div>
                </div>
                <div class="field">
                    <label for="servicio-descripcion">Descripción</label>
                    <textarea id="servicio-descripcion" rows="3" required></textarea>
                </div>
                <div class="row-2">
                    <div class="field">
                        <label for="servicio-precio">Precio referencial (COP)</label>
                        <input id="servicio-precio" type="number" min="0" step="1000">
                    </div>
                    <div class="field">
                        <label for="servicio-imagen">Imagen</label>
                        <input id="servicio-imagen" list="imagenes-disponibles" placeholder="img/TAB.png">
                        <datalist id="imagenes-disponibles">
                            <option value="img/TAB.png"><option value="img/TAM.png"><option value="img/evento.jpg">
                            <option value="img/Recojer.jpg"><option value="img/Portada.jpg"><option value="img/GentePose.jpg">
                        </datalist>
                        <p class="hint">Ruta local (img/...) o URL pública.</p>
                    </div>
                </div>
                <div class="img-preview" id="preview-imagen"></div>
                <p class="form-error" id="error-servicio"></p>
            </div>
            <div class="modal-foot">
                <button class="btn btn-outline" type="button" id="btn-cancelar">Cancelar</button>
                <button class="btn btn-primary" type="submit" id="btn-guardar-servicio">Guardar</button>
            </div>
        </form>
    </dialog>

    <script src="js/admin.js"></script>
    <script>
        const { api, toast, esc, ICONS } = Admin;
        const $ = (id) => document.getElementById(id);
        const modal = $('modal-servicio');
        const moneda = new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
        let servicios = [];
        let filtroCat = '';

        function renderStats() {
            const activos = servicios.filter((s) => s.estado === 'Activo').length;
            const cards = [
                ['Total servicios', servicios.length, 'var(--azul)'],
                ['Activos', activos, 'var(--verde)'],
                ['Inactivos', servicios.length - activos, 'var(--texto-suave)'],
                ['Categorías', new Set(servicios.map((s) => s.categoria)).size, 'var(--rojo)']
            ];
            $('stats').innerHTML = cards.map(([l, v, c]) =>
                `<div class="stat-card" style="--accent:${c}"><div class="stat-label">${l}</div><div class="stat-value">${v}</div></div>`).join('');
        }

        function renderTabla() {
            const q = $('buscar-servicio').value.trim().toLowerCase();
            const lista = servicios.filter((s) =>
                (!filtroCat || s.categoria === filtroCat) &&
                (!q || `${s.nombre} ${s.descripcion}`.toLowerCase().includes(q)));
            const tbody = document.querySelector('#tabla-servicios tbody');
            if (!lista.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No hay servicios que coincidan.</td></tr>';
                return;
            }
            tbody.innerHTML = lista.map((s) => `
                <tr>
                    <td>#${s.id}</td>
                    <td>
                        <div class="cell-main">
                            <img src="${esc(s.imagen || 'img/Portada.jpg')}" alt="" onerror="this.src='img/Portada.jpg'">
                            <div><div class="cell-title">${esc(s.nombre)}</div><div class="cell-sub">${esc(s.descripcion)}</div></div>
                        </div>
                    </td>
                    <td><span class="badge-pill badge-cat">${esc(s.categoria || '-')}</span></td>
                    <td>${s.precio != null ? moneda.format(s.precio) : '—'}</td>
                    <td><span class="badge-pill ${s.estado === 'Activo' ? 'badge-ok' : 'badge-off'}">${esc(s.estado)}</span></td>
                    <td><div class="row-actions">
                        <button class="icon-btn" title="Editar" data-edit="${s.id}" id="editar-servicio-${s.id}">${ICONS.edit}</button>
                        <button class="icon-btn danger" title="Eliminar" data-del="${s.id}" id="eliminar-servicio-${s.id}">${ICONS.trash}</button>
                    </div></td>
                </tr>`).join('');
        }

        async function cargar() {
            try {
                servicios = await api('/api/servicios');
                renderStats();
                renderTabla();
            } catch (e) { toast(e.message, 'error'); }
        }

        function actualizarPreview() {
            const url = $('servicio-imagen').value.trim();
            $('preview-imagen').style.backgroundImage = url ? `url("${url.replace(/"/g, '')}")` : 'none';
        }

        function abrirModal(s = null) {
            $('form-servicio').reset();
            $('error-servicio').textContent = '';
            $('servicio-id').value = s ? s.id : '';
            $('modal-titulo').textContent = s ? 'Editar servicio' : 'Nuevo servicio';
            if (s) {
                $('servicio-nombre').value = s.nombre;
                $('servicio-categoria').value = s.categoria || 'TAB';
                $('servicio-estado').value = s.estado;
                $('servicio-descripcion').value = s.descripcion || '';
                $('servicio-precio').value = s.precio != null ? Math.round(s.precio) : '';
                $('servicio-imagen').value = s.imagen || '';
            }
            actualizarPreview();
            modal.showModal();
        }

        $('form-servicio').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = $('servicio-id').value;
            const body = {
                nombre: $('servicio-nombre').value,
                categoria: $('servicio-categoria').value,
                estado: $('servicio-estado').value,
                descripcion: $('servicio-descripcion').value,
                precio: $('servicio-precio').value,
                imagen: $('servicio-imagen').value
            };
            try {
                await api(id ? `/api/servicios/${id}` : '/api/servicios', { method: id ? 'PUT' : 'POST', body });
                modal.close();
                toast(id ? 'Servicio actualizado' : 'Servicio creado');
                cargar();
            } catch (err) { $('error-servicio').textContent = err.message; }
        });

        document.querySelector('#tabla-servicios tbody').addEventListener('click', async (e) => {
            const edit = e.target.closest('[data-edit]');
            const del = e.target.closest('[data-del]');
            if (edit) abrirModal(servicios.find((s) => s.id == edit.dataset.edit));
            if (del && confirm('¿Eliminar este servicio? Esta acción no se puede deshacer.')) {
                try {
                    await api(`/api/servicios/${del.dataset.del}`, { method: 'DELETE' });
                    toast('Servicio eliminado');
                    cargar();
                } catch (err) { toast(err.message, 'error'); }
            }
        });

        $('filtro-categoria').addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            document.querySelectorAll('#filtro-categoria .chip').forEach((c) => c.classList.toggle('is-active', c === chip));
            filtroCat = chip.dataset.cat;
            renderTabla();
        });

        $('buscar-servicio').addEventListener('input', renderTabla);
        $('servicio-imagen').addEventListener('input', actualizarPreview);
        $('btn-nuevo-servicio').addEventListener('click', () => abrirModal());
        $('btn-cancelar').addEventListener('click', () => modal.close());
        $('btn-cerrar-modal').addEventListener('click', () => modal.close());

        Admin.init({ active: 'servicios', roles: ['Administrador', 'Operador'] }).then(cargar).catch(() => {});
    </script>
</body>
</html>
