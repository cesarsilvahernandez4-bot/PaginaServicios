<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Servicios | Administrador</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        .admin-container { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .table th, .table td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        .table th { background-color: #003049; color: #fff; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; }
        .modal-content { background: #fff; padding: 30px; border-radius: 8px; width: 100%; max-width: 500px; }
        .form-group { margin-bottom: 15px; }
        .form-control { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .action-btns button { padding: 5px 10px; margin-right: 5px; cursor: pointer; border: none; border-radius: 3px; color: #fff; }
        .btn-edit { background-color: #2A9D8F; }
        .btn-delete { background-color: #D62828; }
        .admin-nav { margin-bottom: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="logo" href="index.html">
                <span class="logo-text">Ambulancias <strong>de los Llanos</strong></span>
            </a>
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a class="nav-link" href="#" id="logoutBtn">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="admin-container">
        <div class="admin-nav" id="adminNavLinks">
            <a href="admin-servicios.html" class="btn btn-primary">Gestión de Servicios</a>
            <!-- El enlace a usuarios se inyecta por JS si es admin -->
        </div>

        <div class="admin-header">
            <h2>Gestión de Servicios</h2>
            <button class="btn btn-primary" onclick="openModal()">Nuevo Servicio</button>
        </div>

        <table class="table" id="servicesTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Contenido dinámico -->
            </tbody>
        </table>
    </main>

    <!-- Modal Formulario -->
    <div id="serviceModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Nuevo Servicio</h3>
            <form id="serviceForm">
                <input type="hidden" id="serviceId">
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="nombre" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="descripcion" class="form-control" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Precio Referencial</label>
                    <input type="number" id="precio" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>URL Imagen</label>
                    <input type="text" id="imagen" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="estado" class="form-control" required>
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>
                <div style="text-align: right; margin-top: 20px;">
                    <button type="button" class="btn btn-outline" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/servicios';

        // Validar sesión
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = 'login.html';
        }

        // Mostrar enlace de usuarios solo si es Administrador
        if (user.rol === 'Administrador') {
            document.getElementById('adminNavLinks').innerHTML += `<a href="admin-usuarios.html" class="btn btn-outline">Gestión de Usuarios</a>`;
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        });

        async function fetchServices() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const tbody = document.querySelector('#servicesTable tbody');
            tbody.innerHTML = '';
            data.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td>${s.id}</td>
                        <td>${s.nombre}</td>
                        <td>$${s.precio}</td>
                        <td>${s.estado}</td>
                        <td class="action-btns">
                            <button class="btn-edit" onclick='editService(${JSON.stringify(s).replace(/'/g, "\\'")})'>Editar</button>
                            <button class="btn-delete" onclick="deleteService(${s.id})">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal() {
            document.getElementById('serviceForm').reset();
            document.getElementById('serviceId').value = '';
            document.getElementById('modalTitle').innerText = 'Nuevo Servicio';
            document.getElementById('serviceModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('serviceModal').style.display = 'none';
        }

        function editService(service) {
            document.getElementById('serviceId').value = service.id;
            document.getElementById('nombre').value = service.nombre;
            document.getElementById('descripcion').value = service.descripcion;
            document.getElementById('precio').value = service.precio;
            document.getElementById('imagen').value = service.imagen;
            document.getElementById('estado').value = service.estado;
            document.getElementById('modalTitle').innerText = 'Editar Servicio';
            document.getElementById('serviceModal').style.display = 'flex';
        }

        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('serviceId').value;
            const payload = {
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                precio: document.getElementById('precio').value,
                imagen: document.getElementById('imagen').value,
                estado: document.getElementById('estado').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            closeModal();
            fetchServices();
        });

        async function deleteService(id) {
            if (confirm('¿Está seguro de eliminar este servicio?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchServices();
            }
        }

        // Init
        fetchServices();
    </script>
</body>
</html>
